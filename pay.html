<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLF Secure Checkout</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121619);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        h2 { color: #f3ba2f; margin-bottom: 10px; }
        p { font-size: 14px; opacity: 0.8; line-height: 1.5; }
        .price-tag {
            font-size: 22px;
            font-weight: bold;
            margin: 15px 0;
            color: #4cd137;
        }
        .btn {
            background: linear-gradient(135deg, #f3ba2f, #e1b12c);
            color: #121619;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .error-box {
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid #e74c3c;
            color: #ff6b6b;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-top: 15px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="card" id="app">
        <h2>🪙 WLF Token Checkout</h2>
        <p id="game-title">Unlocking game access securely</p>
        
        <div class="price-tag" id="price-display">499 WLF</div>
        
        <div id="wallet-section">
            <button class="btn" onclick="connectWallet()">🔗 Connect TON Wallet</button>
        </div>

        <div id="action-section" style="display: none;">
            <button class="btn" onclick="processPayment()">⚡ Pay 499 WLF & Unlock</button>
        </div>

        <div id="error-container" class="error-box" style="display: none;"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gameKey = urlParams.get('game') || 'game';
        const cost = urlParams.get('cost') || '499';

        document.getElementById('price-display.innerText = `${cost} WLF Tokens`;

        function connectWallet() {
            setTimeout(() => {
                document.getElementById('wallet-section').style.display = 'none';
                document.getElementById('action-section').style.display = 'block';
            }, 500);
        }

        function processPayment() {
            // شبیه‌سازی موجودی کاربر (برای تست سناریوی کمبود موجودی شما)
            let userBalance = 10; // فرض می‌کنیم کاربر فقط ۱۰ توکن دارد

            if (userBalance < parseInt(cost)) {
                const errBox = document.getElementById('error-container');
                errBox.style.display = 'block';
                errBox.innerHTML = `
                    ❌ <b>موجودی کافی نیست!</b><br>
                    برای این بازی به ${cost} توکن WLF نیاز دارید اما موجودی شما ${userBalance} توکن است.<br><br>
                    <b>پیشنهادهای ویژه برای شما:</b>
                    <button class="btn" style="background:#0088cc; color:white; margin-top:8px;" onclick="window.open('https://dedust.io/swap/EQAUEpGOGqbJy-UIxQ6qblhqAROxgDuiMeB17zImB90n6st0/DUST', '_blank')">🛒 خرید فوری از صرافی DeDust</button>
                    <button class="btn btn-secondary" style="margin-top:8px;" onclick="window.location.href='https://t.me/zzgames_bot'">⛏️ استخراج رایگان در ربات</button>
                `;
                document.getElementById('action-section').style.display = 'none';
            } else {
                alert("Payment successful! Unlocking game...");
            }
        }
    </script>
</body>
</html>
